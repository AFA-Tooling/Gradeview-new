name: Deploy to GCE (manual only — use scripts/deploy-local.sh)

# Auto-deploy on push has been disabled. Building images on the e2-medium VM
# took 5–8 min and frequently broke production during the build window.
#
# To deploy: run `./scripts/deploy-local.sh` from your dev machine. It builds
# linux/amd64 images locally, ships them to the VM, and brings the stack up.

on:
  workflow_dispatch:

jobs:
  noop:
    name: No-op (use scripts/deploy-local.sh)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Auto-deploy is disabled."
          echo "Run ./scripts/deploy-local.sh on your dev machine to deploy."
